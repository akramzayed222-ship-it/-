plugins {
    id 'com.android.application'
}

android {
    namespace 'com.almofeed.math'
    compileSdk 35

    defaultConfig {
        applicationId 'com.almofeed.math'
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '4.1.4-math-assurance'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
