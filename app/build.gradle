plugins {
    id 'com.android.application'
}

android {
    namespace 'com.almofeed.math'
    compileSdk 35

    defaultConfig {
        applicationId 'com.almofeed.math'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '4.1.3-zero-exponent-fontfix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
