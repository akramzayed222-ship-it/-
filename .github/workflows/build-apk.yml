name: AL-MOFEED Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/android-mobile-font-math-test'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source integrity and required math cases
        run: |
          set -euo pipefail
          cmp --silent ALMOFEED_World_Class_Professional.html app/src/main/assets/index.html
          grep -q 'id="almofeed-android-font-fix"' ALMOFEED_World_Class_Professional.html
          grep -q 'setTextZoom(100)' app/src/main/java/com/almofeed/math/MainActivity.java
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          data = p.read_bytes()
          text = data.decode('utf-8')
          print(f'Bundled HTML bytes: {len(data)}')
          print(f'Bundled HTML SHA-256: {hashlib.sha256(data).hexdigest()}')
          required = (
              '#optionsGrid .math-power { font-size: 1.08em !important; }',
              'font-size: clamp(1.2rem, 5.4vw, 1.65rem) !important;',
              'جذر[3](-64)',
              '27^(-1/3)',
              '10 / جذر(5)',
              'جذر(3س + 4) = 5',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Required mobile/math cases missing: ' + repr(missing))
          PYCODE

      - name: Validate inline JavaScript syntax
        run: |
          set -euo pipefail
          JS_DIR="$(mktemp -d)"
          export JS_DIR
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          scripts = [code for code in blocks if code.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found.")
          out = Path(os.environ["JS_DIR"])
          for i, code in enumerate(scripts, 1):
              (out / f"inline-{i}.js").write_text(code, encoding="utf-8")
          print(f"Checking {len(scripts)} inline JavaScript blocks with node --check")
          PYCODE
          for script in "$JS_DIR"/*.js; do
            node --check "$script"
          done

      - name: Run targeted math-rendering regression tests
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          main = next((block for block in blocks if "const MASTER_CHALLENGES=[" in block), None)
          if main is None:
              raise SystemExit("Main quiz script was not found.")
          start = main.find("let useEasternDigits=true;")
          end = main.find("const MASTER_CHALLENGES=[", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not isolate math parser for regression tests.")
          parser = main[start:end]
          tests = r"""
          const square = parseMath("(جذر(5) + جذر(2))^2");
          const rootCount = (square.match(/class="ar-root-container"/g) || []).length;
          if (!square.includes('class="math-power"') || rootCount !== 2 || !square.includes('class="math-exponent"')) {
            throw new Error("Radical-square rendering regression: " + square);
          }

          const radicalOption = parseMath("7 + 2 جذر(10)");
          if (!radicalOption.includes('class="math-binary"') ||
              !radicalOption.includes('class="ar-root-coeff"') ||
              !radicalOption.includes('class="ar-root-container"')) {
            throw new Error("Coefficient plus radical rendering regression: " + radicalOption);
          }

          const equation = parseMath("س = 5/2");
          const equalIndex = equation.indexOf('class="math-op"');
          const fractionIndex = equation.indexOf('class="math-fraction"');
          const numeratorIndex = equation.indexOf('class="math-num"', fractionIndex);
          const denominatorIndex = equation.indexOf('class="math-den"', fractionIndex);
          if (!equation.includes('class="math-binary"') || fractionIndex < 0 ||
              equalIndex < 0 || fractionIndex < equalIndex ||
              numeratorIndex < 0 || denominatorIndex < numeratorIndex) {
            throw new Error("Equation fraction layout regression: " + equation);
          }
          const numeratorRegion = equation.slice(fractionIndex, denominatorIndex);
          if (numeratorRegion.includes('class="math-op"')) {
            throw new Error("Equality was incorrectly included in fraction numerator: " + equation);
          }
          console.log("PASS: (√5 + √2)^2 parser structure");
          console.log("PASS: 7 + 2√10 option parser structure");
          console.log("PASS: س = 5/2 renders equality outside vertical fraction");
          """
          Path("/tmp/almofeed-math-renderer-regression.cjs").write_text(parser + "\n" + tests, encoding="utf-8")
          PYCODE
          node /tmp/almofeed-math-renderer-regression.cjs

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature and calculate checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALMOFEED-Mobile-Font-Fix-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
